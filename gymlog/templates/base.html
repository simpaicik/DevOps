<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}GymLog{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('main.index') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        </span>
        <span>GymLog</span>
      </a>
      <nav class="nav" aria-label="Sayfalar">
        <a href="{{ url_for('main.index') }}"{% if request.endpoint in ('main.index', 'main.edit_workout') %} aria-current="page"{% endif %}>Kayıtlar</a>
        <a href="{{ url_for('main.progress') }}"{% if request.endpoint == 'main.progress' %} aria-current="page"{% endif %}>İlerleme</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="flashes">
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">GymLog · Flask + SQLite · DevOps dersi projesi</footer>
</body>
</html>
