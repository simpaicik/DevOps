name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker:
    # Testler geçtikten sonra imajı derler, konteyneri başlatır ve /health'i yoklar.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker imajını derle
        run: docker build -t gymlog:ci .
      - name: Konteyneri başlat ve sağlık kontrolü yap
        run: |
          docker run -d --name gymlog -p 5000:5000 gymlog:ci
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:5000/health; then echo; echo "Sağlık kontrolü geçti"; exit 0; fi
            sleep 1
          done
          docker logs gymlog
          exit 1
